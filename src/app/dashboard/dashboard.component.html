<h2>User name: {{username}}</h2>
<p>Forecast count: {{ foreCast().length }}</p>

<table cellpadding="0" cellspacing="0" border=".5px solid black">
  <thead >
    <tr >
      <th>Date</th>
      <th>Temperature C</th>
      <th>Temperature F</th>
      <th>Summary</th>
    </tr>
  </thead>

  <tbody>
    @for (f of foreCast(); track f.date) {
      <tr>
        <td>{{ f.date }}</td>
        <td>{{ f.temperatureC }}</td>
        <td>{{ f.temperatureF }}</td>
        <td>{{ f.summary }}</td>
      </tr>
    }
  </tbody>
</table>
